name: Elliott Wave 3 v0 Crypto 5Y

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elliott-wave3-v0-crypto-5y.yml"
      - "scripts/backtest_elliott_wave3_v0_crypto.py"
      - "strategy/elliott_wave3_v0_frozen.md"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/backtest_elliott_wave3_v0_crypto.py
      - name: Run Elliott Wave 3 v0
        run: python scripts/backtest_elliott_wave3_v0_crypto.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-wave3-v0-crypto-5y
          path: data/validation/elliott_wave3_v0_crypto_5y.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/elliott_wave3_v0_crypto_5y.json
          git commit -m "research: add Elliott Wave 3 v0 crypto 5Y result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
