name: CAT-Core v0.4 Stop D Breakout Crypto
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cat-core-v0-4-stop-d-breakout-crypto.yml"
      - "scripts/backtest_cat_core_v0_4_stop_d_breakout_crypto.py"
      - "strategy/cat_core_v0_4_stop_d_breakout_frozen.md"
permissions: {contents: write}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile scripts/backtest_cat_core_v0_4_stop_d_breakout_crypto.py
      - run: python scripts/backtest_cat_core_v0_4_stop_d_breakout_crypto.py
      - uses: actions/upload-artifact@v4
        with: {name: cat-core-stop-d-crypto, path: data/validation/cat_core_v0_4_stop_d_breakout_crypto.json, retention-days: 30}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/cat_core_v0_4_stop_d_breakout_crypto.json
          git commit -m "research: add CAT stop D crypto result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
