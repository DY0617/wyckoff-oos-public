name: Wyckoff Track-B 15-25-60 Alt OOS v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wyckoff-track-b-15-25-60-alt-oos-v1.yml"
      - "scripts/backtest_wyckoff_runner_sweep_engine.py"
      - "scripts/backtest_track_b_15_25_60_alt_oos_v1.py"
      - "scripts/wyckoff_status.py"
      - "strategy/wyckoff_track_b_15_25_60_alt_oos_v1_frozen.md"
permissions: {contents: write}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/backtest_wyckoff_runner_sweep_engine.py scripts/backtest_track_b_15_25_60_alt_oos_v1.py scripts/wyckoff_status.py
      - run: python scripts/backtest_track_b_15_25_60_alt_oos_v1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/wyckoff_track_b_15_25_60_alt_oos_v1.json data/validation/wyckoff_track_b_15_25_60_alt_oos_v1_trades.json
          git commit -m "research: add Track-B 15/25/60 alt OOS result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
