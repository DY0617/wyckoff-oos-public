name: Stock Track-B Runner Ratchet Audit v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-track-b-runner-ratchet-audit-v1.yml"

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - name: Reuse recent-5Y cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/cache
          gh run download 36662442708 -n stock53-recent5y-15m-cache -D data/cache
      - name: Candidate config
        run: |
          cat > /tmp/runner_audit_candidates.json <<'JSON'
          {
            "stage2_configs": [
              {"name":"baseline_exact","overrides":{}},
              {"name":"robust42_exact","overrides":{"ema_gap_atr_max":1.5,"rr_long_min":1.3,"return30_min":0.0}},
              {"name":"balanced49_exact","overrides":{"ema_gap_atr_max":1.5,"rr_long_min":1.3,"return30_min":0.0,"target_distance_atr":5.0}},
              {"name":"maxnet90_exact","overrides":{"return30_min":0.0,"target_distance_atr":5.0}}
            ]
          }
          JSON
      - name: Conservative same-bar ratchet audit
        env:
          EVAL_START: "2021-04-01"
          EVAL_END: "2026-04-01"
          TRADE_SYMS: "AAPL,AMZN,AVGO,CRCL,DELL,MSFT,MU,SNDK,SNXX,SOXL,SPCX,AMD,BABA,INTC,JPM,KORU,MSTR,NFLX,SKHY,SMCI,SOXS,V,COST,GOOGL,LLY,META,NBIS,NVDA,QQQ,TSLA,UBER,WMT,AMAT,CAT,DRAM,EWY,HD,MRVL,MUU,ORCL,SPY,TSM,AAOI,AXTI,BE,COIN,CRM,CSCO,DIS,HOOD,IBM,LITE,TQQQ"
          OUT: "data/validation/stock_track_b_runner_ratchet_audit_trades_v1.json"
          DATA_PARQUET: "data/cache/stock53_recent5y_15m.parquet"
          CONFIG_FILE: "/tmp/runner_audit_candidates.json"
        run: |
          python -m py_compile scripts/backtest_wyckoff_stock_filter_engine_exact_conservative_ratchet.py scripts/screen_stock_track_b_runner_ratchet_audit_v1.py
          python scripts/screen_stock_track_b_runner_ratchet_audit_v1.py
      - name: Summarize
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          src=json.loads(Path("data/validation/stock_track_b_runner_ratchet_audit_trades_v1.json").read_text())
          out={}
          for name,ts in src["trades"].items():
              rs=[float(t["r"]) for t in ts]
              gp=sum(x for x in rs if x>0); gl=-sum(x for x in rs if x<0)
              cr=peak=mdd=0.0; st=mx=0
              for x in sorted(ts,key=lambda z:(z["exit_t"],z["symbol"])):
                  r=float(x["r"]); cr+=r; peak=max(peak,cr); mdd=max(mdd,peak-cr)
                  if r<0: st+=1; mx=max(mx,st)
                  else: st=0
              causes={}
              for t in ts:
                  for e in t.get("events",[]):
                      c=e.get("cause")
                      if c: causes[c]=causes.get(c,0)+1
              out[name]={
                  "trades":len(rs),"wins":sum(x>0 for x in rs),"losses":sum(x<0 for x in rs),
                  "win_rate":sum(x>0 for x in rs)/len(rs) if rs else None,
                  "net_r":sum(rs),"avg_r":statistics.fmean(rs) if rs else None,
                  "profit_factor":gp/gl if gl>0 else None,
                  "max_drawdown_r":mdd,"max_consecutive_losses":mx,
                  "same_bar_causes":causes
              }
          Path("data/validation/stock_track_b_runner_ratchet_audit_summary_v1.json").write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-track-b-runner-ratchet-audit-v1
          path: |
            data/validation/stock_track_b_runner_ratchet_audit_trades_v1.json
            data/validation/stock_track_b_runner_ratchet_audit_summary_v1.json
          retention-days: 30
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock_track_b_runner_ratchet_audit_trades_v1.json data/validation/stock_track_b_runner_ratchet_audit_summary_v1.json
          git commit -m "validation: add runner same-bar ratchet audit [skip ci]" || exit 0
          git pull --rebase origin main
          git push
