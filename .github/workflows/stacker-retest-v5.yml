name: Stacker v5 — independent retest after full TP

on:
  push:
    branches: [research/stacker-v5-independent-retest]
    paths:
      - ".github/workflows/stacker-retest-v5.yml"
      - "scripts/stacker_retest_v5_core.py"
      - "scripts/backtest_stacker_retest_v5.py"
      - "tests/test_stacker_retest_v5.py"
      - "strategy/stacker_retest_v5_frozen.md"
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: stacker-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Python syntax
        run: python -m py_compile scripts/stacker_retest_v5_core.py scripts/backtest_stacker_retest_v5.py tests/test_stacker_retest_v5.py
      - name: Reentry event-time, stop and risk tests
        run: python -m unittest discover -s tests -p 'test_stacker_retest_v5.py' -v

  crypto:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: BTC and ETH complete 5yr independent retest
        run: python scripts/backtest_stacker_retest_v5.py --market crypto --out data/validation/stacker_retest_v5_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-retest-v5-crypto
          path: data/validation/stacker_retest_v5_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stocks:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: US RTH historical stocks independent retest
        run: python scripts/backtest_stacker_retest_v5.py --market stock --out data/validation/stacker_retest_v5_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-retest-v5-stock
          path: data/validation/stacker_retest_v5_stock.json
          retention-days: 30
          if-no-files-found: warn
