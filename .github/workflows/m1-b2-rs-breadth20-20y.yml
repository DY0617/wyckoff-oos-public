name: M1-B2 RS Breadth20 20Y

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-b2-rs-breadth20-20y.yml"
      - "scripts/backtest_m1_b2_rs_breadth20_20y_shard.py"
      - "scripts/merge_m1_b2_rs_breadth20_20y.py"

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check duckdb
      - env:
          EVAL_START: "${{ matrix.start }}"
          EVAL_END: "${{ matrix.end }}"
          DATA_END: "2026-04-01"
          OUT: "data/validation/m1_b2_rs_breadth20_20y_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_m1_b2_rs_breadth20_20y_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: m1-b2-rs-breadth20-${{ matrix.id }}
          path: data/validation/m1_b2_rs_breadth20_20y_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: m1-b2-rs-breadth20-*
          path: data/validation/m1_b2_rs_breadth20_20y_shards
          merge-multiple: true
      - run: python scripts/merge_m1_b2_rs_breadth20_20y.py
      - uses: actions/upload-artifact@v4
        with:
          name: m1-b2-rs-breadth20-20y
          path: data/validation/m1_b2_rs_breadth20_20y.json
