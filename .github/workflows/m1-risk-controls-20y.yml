name: M1 Risk Controls 20Y

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-risk-controls-20y.yml"
      - "scripts/evaluate_m1_risk_controls_20y.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/evaluate_m1_risk_controls_20y.py
      - name: Run
        run: python scripts/evaluate_m1_risk_controls_20y.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: m1-risk-controls-20y
          path: data/validation/m1_risk_controls_20y.json
          retention-days: 30
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/m1_risk_controls_20y.json
          git commit -m "research: add M1 risk controls 20y [skip ci]" || exit 0
          git pull --rebase origin main
          git push
