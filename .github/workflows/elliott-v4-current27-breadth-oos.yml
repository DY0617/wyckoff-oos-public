name: Elliott v4 Current27 Breadth OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elliott-v4-current27-breadth-oos.yml"
      - "scripts/backtest_elliott_v4_current27_breadth_oos.py"
      - "strategy/elliott_v4_current27_breadth_oos_frozen.md"

permissions:
  actions: read
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Reuse 25Y US30x2 chunks
        uses: actions/download-artifact@v4
        with:
          pattern: elliott-dow2000-*
          path: data/tmp_us30x2_25y
          merge-multiple: true
          repository: DY0617/wyckoff-oos-public
          run-id: 37103825559
          github-token: ${{ github.token }}
      - run: python -m py_compile scripts/backtest_elliott_v4_current27_breadth_oos.py
      - run: python scripts/backtest_elliott_v4_current27_breadth_oos.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-v4-current27-breadth-oos
          path: data/validation/elliott_wave3_v4_current27_breadth_oos_25y.json
          retention-days: 30
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/elliott_wave3_v4_current27_breadth_oos_25y.json
          git commit -m "research: add Elliott v4 current27 breadth OOS [skip ci]" || exit 0
          git pull --rebase origin main
          git push
