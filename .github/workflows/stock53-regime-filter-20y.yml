name: Stock53 Regime Filter 20Y Comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-regime-filter-20y.yml"
      - "scripts/evaluate_stock53_regime_filters_shard.py"
      - "scripts/merge_stock53_regime_filters.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/evaluate_stock53_regime_filters_shard.py scripts/merge_stock53_regime_filters.py
      - name: Run shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          OUT: "data/validation/stock53_regime_shards/shard_${{ matrix.id }}.json"
        run: python scripts/evaluate_stock53_regime_filters_shard.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: stock53-regime-${{ matrix.id }}
          path: data/validation/stock53_regime_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: stock53-regime-*
          path: data/validation/stock53_regime_shards
          merge-multiple: true
      - name: Merge
        run: python scripts/merge_stock53_regime_filters.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: stock53-regime-filter-20y-comparison
          path: data/validation/stock53_regime_filter_20y_comparison.json
          retention-days: 30
      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock53_regime_filter_20y_comparison.json
          git commit -m "validation: add stock53 regime-filter 20y comparison [skip ci]" || exit 0
          git pull --rebase origin main
          git push
