name: SR Reclaim v1.1 Retest Entry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sr-reclaim-v1-1-retest.yml"
      - "scripts/backtest_sr_reclaim_v1_1_retest.py"
      - "scripts/backtest_sr_reclaim_v1_crypto.py"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/backtest_sr_reclaim_v1_1_retest.py
      - name: Run retest-entry diagnostic
        run: python scripts/backtest_sr_reclaim_v1_1_retest.py
      - uses: actions/upload-artifact@v4
        with:
          name: sr-reclaim-v1-1-retest
          path: data/validation/sr_reclaim_v1_1_retest_entry.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/sr_reclaim_v1_1_retest_entry.json
          git commit -m "research: add SR Reclaim v1.1 retest result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
