name: Stock Track-B Recent5Y Structural Optimization v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-track-b-structural-opt-recent5y-v1.yml"
      - "scripts/extract_stock53_recent5y_15m_cache.py"
      - "scripts/screen_stock_track_b_structural_shard_v1.py"
      - "scripts/merge_stock_track_b_structural_stage1_v1.py"
      - "scripts/merge_stock_track_b_structural_stage2_v1.py"
      - "scripts/backtest_wyckoff_stock_filter_engine.py"
      - "strategy/stock_track_b_e_recent5y_structural_opt_v1_frozen.md"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python -m py_compile scripts/extract_stock53_recent5y_15m_cache.py
      - run: python scripts/extract_stock53_recent5y_15m_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock53-recent5y-15m-cache
          path: |
            data/cache/stock53_recent5y_15m.parquet
            data/cache/stock53_recent5y_15m_meta.json
          retention-days: 7
          if-no-files-found: error

  stage1:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: "01", syms: "AAPL,AMZN,AVGO,CRCL,DELL,MSFT,MU,SNDK,SNXX,SOXL,SPCX"}
          - {id: "02", syms: "AMD,BABA,INTC,JPM,KORU,MSTR,NFLX,SKHY,SMCI,SOXS,V"}
          - {id: "03", syms: "COST,GOOGL,LLY,META,NBIS,NVDA,QQQ,TSLA,UBER,WMT"}
          - {id: "04", syms: "AMAT,CAT,DRAM,EWY,HD,MRVL,MUU,ORCL,SPY,TSM"}
          - {id: "05", syms: "AAOI,AXTI,BE,COIN,CRM,CSCO,DIS,HOOD,IBM,LITE,TQQQ"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - uses: actions/download-artifact@v4
        with:
          name: stock53-recent5y-15m-cache
          path: data/cache
      - run: python -m py_compile scripts/screen_stock_track_b_structural_shard_v1.py scripts/backtest_wyckoff_stock_filter_engine.py scripts/evaluate_stock53_filter_factorial_shard.py scripts/wyckoff_status.py
      - name: Run Stage 1 shard
        env:
          EVAL_START: "2021-04-01"
          EVAL_END: "2026-04-01"
          TRADE_SYMS: "${{ matrix.syms }}"
          OUT: "data/validation/stock_structural_stage1_shards/shard_${{ matrix.id }}.json"
          DATA_PARQUET: "data/cache/stock53_recent5y_15m.parquet"
        run: python scripts/screen_stock_track_b_structural_shard_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-struct-stage1-${{ matrix.id }}
          path: data/validation/stock_structural_stage1_shards/shard_${{ matrix.id }}.json
          retention-days: 7
          if-no-files-found: error

  merge_stage1:
    needs: stage1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stock-struct-stage1-*
          path: data/validation/stock_structural_stage1_shards
          merge-multiple: true
      - run: python scripts/merge_stock_track_b_structural_stage1_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-struct-stage1-merged
          path: data/validation/stock_track_b_e_recent5y_structural_stage1_v1.json
          retention-days: 7

  stage2:
    needs: [merge_stage1, extract]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: "01", syms: "AAPL,AMZN,AVGO,CRCL,DELL,MSFT,MU,SNDK,SNXX,SOXL,SPCX"}
          - {id: "02", syms: "AMD,BABA,INTC,JPM,KORU,MSTR,NFLX,SKHY,SMCI,SOXS,V"}
          - {id: "03", syms: "COST,GOOGL,LLY,META,NBIS,NVDA,QQQ,TSLA,UBER,WMT"}
          - {id: "04", syms: "AMAT,CAT,DRAM,EWY,HD,MRVL,MUU,ORCL,SPY,TSM"}
          - {id: "05", syms: "AAOI,AXTI,BE,COIN,CRM,CSCO,DIS,HOOD,IBM,LITE,TQQQ"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - uses: actions/download-artifact@v4
        with:
          name: stock53-recent5y-15m-cache
          path: data/cache
      - uses: actions/download-artifact@v4
        with:
          name: stock-struct-stage1-merged
          path: data/validation
      - run: python -m py_compile scripts/screen_stock_track_b_structural_shard_v1.py scripts/backtest_wyckoff_stock_filter_engine.py scripts/evaluate_stock53_filter_factorial_shard.py scripts/wyckoff_status.py
      - name: Run Stage 2 shard
        env:
          EVAL_START: "2021-04-01"
          EVAL_END: "2026-04-01"
          TRADE_SYMS: "${{ matrix.syms }}"
          OUT: "data/validation/stock_structural_stage2_shards/shard_${{ matrix.id }}.json"
          CONFIG_FILE: "data/validation/stock_track_b_e_recent5y_structural_stage1_v1.json"
          DATA_PARQUET: "data/cache/stock53_recent5y_15m.parquet"
        run: python scripts/screen_stock_track_b_structural_shard_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-struct-stage2-${{ matrix.id }}
          path: data/validation/stock_structural_stage2_shards/shard_${{ matrix.id }}.json
          retention-days: 7
          if-no-files-found: error

  merge_stage2:
    needs: stage2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stock-struct-stage1-merged
          path: data/validation
      - uses: actions/download-artifact@v4
        with:
          pattern: stock-struct-stage2-*
          path: data/validation/stock_structural_stage2_shards
          merge-multiple: true
      - run: python scripts/merge_stock_track_b_structural_stage2_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-structural-opt-recent5y-v1
          path: |
            data/validation/stock_track_b_e_recent5y_structural_stage1_v1.json
            data/validation/stock_track_b_e_recent5y_structural_opt_v1.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock_track_b_e_recent5y_structural_stage1_v1.json data/validation/stock_track_b_e_recent5y_structural_opt_v1.json
          git commit -m "research: add recent-5Y stock structural optimization result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
