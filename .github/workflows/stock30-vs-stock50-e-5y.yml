name: Stock30 vs Stock50 E 5Y

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock30-vs-stock50-e-5y.yml"
      - "scripts/evaluate_stock30_vs_stock50_e_5y.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/evaluate_stock30_vs_stock50_e_5y.py
      - name: Run comparison
        run: python scripts/evaluate_stock30_vs_stock50_e_5y.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stock30-vs-stock50-e-5y
          path: data/validation/stock30_vs_stock50_e_5y.json
          retention-days: 30
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock30_vs_stock50_e_5y.json
          git commit -m "validation: add stock30 vs stock50 E 5y [skip ci]" || exit 0
          git pull --rebase origin main
          git push
