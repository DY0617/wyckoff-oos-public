name: EasyChart Synthesis v0.1 Crypto8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_easychart_synthesis_v01.py"
      - "strategy/easychart_synthesis_v0_1.md"
      - ".github/workflows/easychart-synthesis-v01.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/backtest_trend_structure_v0_1_crypto.py scripts/backtest_smc_liq_fvg_v01.py scripts/backtest_easychart_synthesis_v01.py
      - name: Run synthesis
        run: python scripts/backtest_easychart_synthesis_v01.py
      - uses: actions/upload-artifact@v4
        with:
          name: easychart-synthesis-v01-crypto8
          path: data/validation/easychart_synthesis_v01_crypto8.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/easychart_synthesis_v01_crypto8.json
          git commit -m "research: add EasyChart synthesis v0.1 result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
