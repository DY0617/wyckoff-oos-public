name: EasyChart A v0.3 Trend Quality Plateau

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_easychart_synthesis_v01.py"
      - "scripts/backtest_easychart_a_v03_trend_quality_plateau.py"
      - ".github/workflows/easychart-a-v03-trend-quality.yml"

permissions:
  contents: write

jobs:
  plateau:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/backtest_trend_structure_v0_1_crypto.py scripts/backtest_smc_liq_fvg_v01.py scripts/backtest_easychart_synthesis_v01.py scripts/backtest_easychart_a_v03_trend_quality_plateau.py
      - name: Run plateau
        run: python scripts/backtest_easychart_a_v03_trend_quality_plateau.py
      - uses: actions/upload-artifact@v4
        with:
          name: easychart-a-v03-trend-quality
          path: data/validation/easychart_a_v03_trend_quality_plateau.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/easychart_a_v03_trend_quality_plateau.json
          git commit -m "research: add EasyChart A v0.3 trend-quality result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
