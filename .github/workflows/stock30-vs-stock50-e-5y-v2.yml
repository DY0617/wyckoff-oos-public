name: Stock30 vs Stock50 E 5Y V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock30-vs-stock50-e-5y-v2.yml"
      - "scripts/evaluate_stock30_vs_stock50_e_5y_v2.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/evaluate_stock30_vs_stock50_e_5y_v2.py
      - name: Run comparison
        run: python scripts/evaluate_stock30_vs_stock50_e_5y_v2.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: stock30-vs-stock50-e-5y-v2
          path: data/validation/stock30_vs_stock50_e_5y_v2.json
          retention-days: 30
