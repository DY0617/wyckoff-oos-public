name: Entry First v10 — range expansion / volume participation

on:
  push:
    branches: [research/entry-v10-expansion]
    paths:
      - ".github/workflows/entry-expansion-v10.yml"
      - "scripts/entry_expansion_v10_core.py"
      - "scripts/backtest_entry_expansion_v10.py"
      - "tests/test_entry_expansion_v10.py"
      - "strategy/entry_expansion_v10_frozen.md"
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: entry-expansion-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax checks
        run: python -m py_compile scripts/entry_expansion_v10_core.py scripts/backtest_entry_expansion_v10.py tests/test_entry_expansion_v10.py
      - name: Causal signal and frozen portfolio invariant tests
        run: python -m unittest discover -s tests -p 'test_entry_expansion_v10.py' -v

  known_crypto:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: BTC/ETH 5 year directional breakout study
        run: python scripts/backtest_entry_expansion_v10.py --cohort known_crypto --out data/validation/entry_expansion_v10_known_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-expansion-v10-known-crypto
          path: data/validation/entry_expansion_v10_known_crypto.json
          retention-days: 30
          if-no-files-found: warn

  new_crypto:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: BNB SOL XRP 4 year breakouts / fees
        run: python scripts/backtest_entry_expansion_v10.py --cohort new_crypto --out data/validation/entry_expansion_v10_new_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-expansion-v10-new-crypto
          path: data/validation/entry_expansion_v10_new_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stocks:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: DuckDB for remote parquet RTH
        run: python -m pip install --disable-pip-version-check duckdb
      - name: US 29 equity and ETF directional breaks
        run: python scripts/backtest_entry_expansion_v10.py --cohort stock --out data/validation/entry_expansion_v10_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-expansion-v10-stock
          path: data/validation/entry_expansion_v10_stock.json
          retention-days: 30
          if-no-files-found: warn
