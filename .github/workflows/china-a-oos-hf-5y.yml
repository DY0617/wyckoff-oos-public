name: China A-Share Untouched OOS 5Y

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '30'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow huggingface_hub

      - name: Download selected China A-share 1m files
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil

          repo="neigezhu/china-a-share-1min-ohlcv"
          files=[
            ("SH","600519"),("SH","600036"),("SH","601318"),("SH","600030"),
            ("SH","600276"),("SH","600900"),("SH","601166"),("SH","601398"),
            ("SZ","000001"),("SZ","000858"),("SZ","000333"),("SZ","002415"),
          ]
          root=Path("data/tmp_china_a")
          for ex,code in files:
              rel=f"data/stock_1m/{ex}/{code}.parquet"
              p=Path(hf_hub_download(repo_id=repo,filename=rel,repo_type="dataset"))
              dst=root/ex/f"{code}.parquet"
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dst)
              print("DOWNLOADED",ex,code,dst.stat().st_size,flush=True)
          PY

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find data/tmp_china_a -name '*.parquet' | wc -l)"
          echo "parquet_count=$COUNT"
          test "$COUNT" -eq 12
          du -sh data/tmp_china_a

      - name: Run frozen Track B OOS
        run: python scripts/backtest_china_a_oos_hf_5y.py

      - name: Show summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/validation/china_a_track_b_oos_5y.json"))
          print(json.dumps({
              "totals":p.get("totals"),
              "by_year":p.get("by_year"),
              "by_symbol":p.get("by_symbol"),
              "errors":p.get("errors"),
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit OOS result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/china_a_track_b_oos_5y.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "validation: add China A-share untouched OOS results [skip ci]"
            git push
          fi
