name: HF DuckDB Month Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hf-duckdb-month-probe.yml"
      - "scripts/probe_hf_duckdb_month.py"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python scripts/probe_hf_duckdb_month.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/hf_duckdb_probe.json
          git commit -m "debug: record HF DuckDB probe [skip ci]" || exit 0
          git pull --rebase origin main
          git push
