name: Added 20 Stocks HF 5Y Exact-Touch Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock20-added-hf-5y-exact-touch.yml"
      - "scripts/backtest_stock20_added_track_b_hf_5y_exact_touch.py"
      - "scripts/backtest_wyckoff_5y_exact_touch.py"
      - "scripts/wyckoff_status.py"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb

      - name: Syntax check
        run: python -m py_compile scripts/backtest_stock20_added_track_b_hf_5y_exact_touch.py scripts/backtest_wyckoff_5y_exact_touch.py scripts/wyckoff_status.py

      - name: Run added-20 5Y exact-touch backtest
        run: python scripts/backtest_stock20_added_track_b_hf_5y_exact_touch.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock20-added-hf-5y-exact-touch
          path: data/validation/stock20_added_track_b_hf_5y_exact_touch.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit result
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock20_added_track_b_hf_5y_exact_touch.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "validation: add added-20 stocks 5y exact-touch result [skip ci]"
            git pull --rebase origin main
            git push
          fi
