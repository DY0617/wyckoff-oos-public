name: Trend Structure v0.1 Stock53 Recent5Y

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trend-structure-v0-1-stock53-recent5y.yml"
      - "scripts/backtest_trend_structure_v0_1_stock53.py"
      - "scripts/backtest_trend_structure_v0_1_crypto.py"
      - "scripts/extract_stock53_recent5y_15m_cache.py"
      - "strategy/trend_structure_v0_1_frozen.md"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python -m py_compile scripts/extract_stock53_recent5y_15m_cache.py
      - run: python scripts/extract_stock53_recent5y_15m_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: trend-structure-stock53-cache
          path: |
            data/cache/stock53_recent5y_15m.parquet
            data/cache/stock53_recent5y_15m_meta.json
          retention-days: 7
          if-no-files-found: error

  backtest:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - uses: actions/download-artifact@v4
        with:
          name: trend-structure-stock53-cache
          path: data/cache
      - name: Compile
        run: python -m py_compile scripts/backtest_trend_structure_v0_1_crypto.py scripts/backtest_trend_structure_v0_1_stock53.py
      - name: Run Stock53 Recent5Y
        run: python scripts/backtest_trend_structure_v0_1_stock53.py
      - uses: actions/upload-artifact@v4
        with:
          name: trend-structure-v0-1-stock53-recent5y
          path: data/validation/trend_structure_v0_1_stock53_recent5y.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/trend_structure_v0_1_stock53_recent5y.json
          git commit -m "research: add Trend Structure v0.1 stock53 Recent5Y result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
