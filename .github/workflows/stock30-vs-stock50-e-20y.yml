name: Stock30 vs Stock50 E 20Y

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock30-vs-stock50-e-20y.yml"
      - "scripts/evaluate_stock30_vs_50_e_20y_shard.py"
      - "scripts/merge_stock30_vs_50_e_20y.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/evaluate_stock30_vs_50_e_20y_shard.py scripts/merge_stock30_vs_50_e_20y.py
      - name: Run shard
        env:
          EVAL_START: "${{ matrix.start }}"
          EVAL_END: "${{ matrix.end }}"
          DATA_END: "2026-04-01"
          OUT: "data/validation/stock30_vs_50_e_20y_shards/shard_${{ matrix.id }}.json"
        run: python scripts/evaluate_stock30_vs_50_e_20y_shard.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: stock30-vs-50-e-20y-${{ matrix.id }}
          path: data/validation/stock30_vs_50_e_20y_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: stock30-vs-50-e-20y-*
          path: data/validation/stock30_vs_50_e_20y_shards
          merge-multiple: true
      - name: Merge
        run: python scripts/merge_stock30_vs_50_e_20y.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: stock30-vs-stock50-e-20y
          path: data/validation/stock30_vs_stock50_e_20y.json
          retention-days: 30
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock30_vs_stock50_e_20y.json
          git commit -m "validation: add stock30 vs stock50 E 20y [skip ci]" || exit 0
          git pull --rebase origin main
          git push
