name: Stock53 Track B HF 20Y Exact Touch V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-track-b-hf-20y-v2.yml"
      - "scripts/backtest_stock53_track_b_hf_20y_shard_v2.py"
      - "scripts/merge_stock53_track_b_hf_20y.py"
      - "scripts/backtest_wyckoff_exact_touch_ct.py"
      - "scripts/wyckoff_status.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: "01"
            start: "2006-04-01"
            end: "2010-04-01"
          - id: "02"
            start: "2010-04-01"
            end: "2014-04-01"
          - id: "03"
            start: "2014-04-01"
            end: "2018-04-01"
          - id: "04"
            start: "2018-04-01"
            end: "2022-04-01"
          - id: "05"
            start: "2022-04-01"
            end: "2026-04-01"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/backtest_stock53_track_b_hf_20y_shard_v2.py scripts/backtest_wyckoff_exact_touch_ct.py scripts/wyckoff_status.py
      - name: Run shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          DATA_END: "2026-04-01"
          OUT: "data/validation/stock53_20y_shards_v2/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_stock53_track_b_hf_20y_shard_v2.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: stock53-20y-v2-${{ matrix.id }}
          path: data/validation/stock53_20y_shards_v2/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: stock53-20y-v2-*
          path: data/validation/stock53_20y_shards
          merge-multiple: true
      - name: Merge results
        run: python scripts/merge_stock53_track_b_hf_20y.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: stock53-track-b-hf-20y-final-v2
          path: data/validation/stock53_track_b_hf_20y_exact_touch.json
          retention-days: 30
      - name: Commit final result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock53_track_b_hf_20y_exact_touch.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "validation: add stock53 Track B 20y exact-touch result v2 [skip ci]"
            git pull --rebase origin main
            git push
          fi
