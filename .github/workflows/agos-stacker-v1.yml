name: AGOS-inspired Stacker v1 — research validation

on:
  push:
    branches: [research/agos-stacker-v1]
    paths:
      - ".github/workflows/agos-stacker-v1.yml"
      - "scripts/agos_stacker_v1_core.py"
      - "scripts/backtest_agos_stacker_v1.py"
      - "tests/test_agos_stacker_v1.py"
      - "strategy/agos_stacker_v1_frozen.md"
      - "scripts/backtest_arm_v1_swing.py"
      - "scripts/arm_v1_swing_core.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agos-stacker-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m py_compile scripts/agos_stacker_v1_core.py scripts/backtest_agos_stacker_v1.py tests/test_agos_stacker_v1.py
      - name: Deterministic engine invariants
        run: python -m unittest discover -s tests -p 'test_agos_stacker_v1.py' -v

  crypto:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 5y BTC ETH with historical funding
        run: python scripts/backtest_agos_stacker_v1.py --market crypto --out data/validation/agos_stacker_v1_crypto.json
      - name: Store run artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agos-stacker-v1-crypto
          path: data/validation/agos_stacker_v1_crypto.json
          if-no-files-found: warn
          retention-days: 30

  stock:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: US equities RTH 4.5y
        run: python scripts/backtest_agos_stacker_v1.py --market stock --out data/validation/agos_stacker_v1_stock.json
      - name: Store run artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agos-stacker-v1-stock
          path: data/validation/agos_stacker_v1_stock.json
          if-no-files-found: warn
          retention-days: 30
