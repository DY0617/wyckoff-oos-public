name: Stock Cash-to-Futures Merge Retry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-cash-to-futures-merge-retry.yml"

permissions:
  contents: write
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - uses: actions/download-artifact@v4
        with:
          pattern: stock-cash-to-futures-*
          path: data/validation/stock_cash_to_futures_shards
          merge-multiple: true
          run-id: 36591628965
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/merge_stock_track_b_e_cash_to_binance_futures_exec_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-cash-to-futures-final
          path: |
            data/validation/stock_track_b_e_cash_to_binance_futures_exec_v1_sharded.json
            data/validation/stock_track_b_e_cash_to_binance_futures_exec_v1_sharded_trades.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/stock_track_b_e_cash_to_binance_futures_exec_v1_sharded.json data/validation/stock_track_b_e_cash_to_binance_futures_exec_v1_sharded_trades.json
          git commit -m "research: add cash-to-Binance stock-futures execution result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
