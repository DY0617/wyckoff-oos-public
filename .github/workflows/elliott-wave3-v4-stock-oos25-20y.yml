name: Elliott Wave 3 v4 Stock OOS25 20Y

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elliott-wave3-v4-stock-oos25-20y.yml"
      - "scripts/backtest_elliott_wave3_v4_stock_oos25_20y_shard.py"
      - "scripts/merge_elliott_wave3_v4_stock_oos25_20y.py"
      - "strategy/elliott_wave3_v4_stock_oos25_20y_frozen.md"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - name: Compile
        run: python -m py_compile scripts/backtest_elliott_wave3_v4_stock_oos25_20y_shard.py
      - name: Run shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          DATA_END: "2026-04-01"
          OUT: "data/validation/elliott_v4_stock20y_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_elliott_wave3_v4_stock_oos25_20y_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-v4-stock20y-${{ matrix.id }}
          path: data/validation/elliott_v4_stock20y_shards/shard_${{ matrix.id }}.json
          retention-days: 7
          if-no-files-found: error

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: elliott-v4-stock20y-*
          path: data/validation/elliott_v4_stock20y_shards
          merge-multiple: true
      - name: Merge
        run: python scripts/merge_elliott_wave3_v4_stock_oos25_20y.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-wave3-v4-stock-oos25-20y-final
          path: data/validation/elliott_wave3_v4_stock_oos25_20y.json
          retention-days: 30
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/elliott_wave3_v4_stock_oos25_20y.json
          git commit -m "research: add Elliott Wave 3 v4 Stock OOS25 20Y [skip ci]" || exit 0
          git pull --rebase origin main
          git push
