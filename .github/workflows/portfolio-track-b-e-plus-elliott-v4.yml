name: Portfolio Track B-E plus Elliott v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-track-b-e-plus-elliott-v4.yml"
      - "scripts/analyze_portfolio_track_b_e_plus_elliott_v4.py"
      - "strategy/portfolio_track_b_e_plus_elliott_v4_frozen.md"

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Reuse 25Y DJIA2000 chunks
        uses: actions/download-artifact@v4
        with:
          pattern: elliott-dow2000-*
          path: data/tmp_us30x2_25y
          merge-multiple: true
          repository: DY0617/wyckoff-oos-public
          run-id: 37103825559
          github-token: ${{ github.token }}
      - run: python -m py_compile scripts/analyze_portfolio_track_b_e_plus_elliott_v4.py
      - run: python scripts/analyze_portfolio_track_b_e_plus_elliott_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-track-b-e-plus-elliott-v4
          path: data/validation/portfolio_track_b_e_plus_elliott_v4_dow2000_25y.json
          retention-days: 30
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/portfolio_track_b_e_plus_elliott_v4_dow2000_25y.json
          git commit -m "research: add Track B-E plus Elliott v4 portfolio test [skip ci]" || exit 0
          git pull --rebase origin main
          git push
