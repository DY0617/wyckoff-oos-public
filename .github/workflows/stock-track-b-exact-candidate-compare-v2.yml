name: Stock Track-B Exact Candidate Compare v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock-track-b-exact-candidate-compare-v2.yml"

permissions:
  actions: read
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - name: Reuse recent-5Y cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/cache
          gh run download 36662442708 -n stock53-recent5y-15m-cache -D data/cache
          ls -lh data/cache
      - name: Candidate config
        run: |
          cat > /tmp/exact_candidates.json <<'JSON'
          {
            "stage2_configs": [
              {"name":"baseline_exact","overrides":{}},
              {"name":"robust54_like","overrides":{"ema_gap_atr_max":1.5,"rr_long_min":1.3,"return30_min":0.0}},
              {"name":"balanced65_like","overrides":{"ema_gap_atr_max":1.5,"rr_long_min":1.3,"return30_min":0.0,"target_distance_atr":5.0}},
              {"name":"maxnet113_like","overrides":{"return30_min":0.0,"target_distance_atr":5.0}}
            ]
          }
          JSON
      - name: Exact-touch candidate backtest
        env:
          EVAL_START: "2021-04-01"
          EVAL_END: "2026-04-01"
          TRADE_SYMS: "AAPL,AMZN,AVGO,CRCL,DELL,MSFT,MU,SNDK,SNXX,SOXL,SPCX,AMD,BABA,INTC,JPM,KORU,MSTR,NFLX,SKHY,SMCI,SOXS,V,COST,GOOGL,LLY,META,NBIS,NVDA,QQQ,TSLA,UBER,WMT,AMAT,CAT,DRAM,EWY,HD,MRVL,MUU,ORCL,SPY,TSM,AAOI,AXTI,BE,COIN,CRM,CSCO,DIS,HOOD,IBM,LITE,TQQQ"
          OUT: "data/validation/stock_track_b_structural_exact_candidate_trades_v2.json"
          DATA_PARQUET: "data/cache/stock53_recent5y_15m.parquet"
          CONFIG_FILE: "/tmp/exact_candidates.json"
        run: |
          python -m py_compile scripts/backtest_wyckoff_stock_filter_engine_exact.py scripts/screen_stock_track_b_structural_shard_exact_v2.py
          python scripts/screen_stock_track_b_structural_shard_exact_v2.py
      - name: Summarize candidates
        run: |
          python - <<'PY'
          import json, math, statistics
          from datetime import datetime, timezone
          from pathlib import Path

          UTC=timezone.utc
          SRC=Path("data/validation/stock_track_b_structural_exact_candidate_trades_v2.json")
          OUT=Path("data/validation/stock_track_b_structural_exact_candidate_compare_v2.json")
          o=json.loads(SRC.read_text())
          expected={"trades":86,"net_r":34.40605212776125,"profit_factor":2.038699188142955,
                    "max_drawdown_r":6.167825161938435,"max_consecutive_losses":5}

          def stats(ts):
              ts=sorted(ts,key=lambda x:(x["exit_t"],x["symbol"]))
              rs=[float(x["r"]) for x in ts]
              gp=sum(x for x in rs if x>0); gl=-sum(x for x in rs if x<0)
              cr=peak=mdd=0.0; st=mx=0
              for x in rs:
                  cr+=x; peak=max(peak,cr); mdd=max(mdd,peak-cr)
                  if x<0: st+=1; mx=max(mx,st)
                  else: st=0
              return {"trades":len(rs),"wins":sum(x>0 for x in rs),"losses":sum(x<0 for x in rs),
                      "win_rate":sum(x>0 for x in rs)/len(rs) if rs else None,
                      "net_r":sum(rs),"avg_r":statistics.fmean(rs) if rs else None,
                      "profit_factor":gp/gl if gl>0 else None,
                      "max_drawdown_r":mdd,"max_consecutive_losses":mx,
                      "net_r_over_mdd":sum(rs)/mdd if mdd>0 else None}

          def dt_ms(s): return int(datetime.fromisoformat(s).replace(tzinfo=UTC).timestamp()*1000)

          def slice_stats(ts,a,b):
              lo,hi=dt_ms(a),dt_ms(b)
              return stats([x for x in ts if lo<=int(x["entry_t"])<hi])

          def yearly(ts):
              out={}
              for y in range(2021,2027):
                  xs=[x for x in ts if datetime.fromtimestamp(x["entry_t"]/1000,UTC).year==y]
                  if xs: out[str(y)]=stats(xs)
              return out

          def add_month(y,m,k):
              z=m-1+k
              return y+z//12,z%12+1

          def rolling(ts,months):
              rows=[]
              y,m=2021,4
              ey,em=add_month(2026,4,-months)
              while (y,m)<=(ey,em):
                  y2,m2=add_month(y,m,months)
                  a=f"{y:04d}-{m:02d}-01"; b=f"{y2:04d}-{m2:02d}-01"
                  q=slice_stats(ts,a,b)
                  if q["trades"]>=3: rows.append({"start":a[:7],**q})
                  y,m=add_month(y,m,1)
              if not rows:return None
              worst=min(rows,key=lambda x:x["net_r"])
              return {"months":months,"windows":len(rows),
                      "negative_windows":sum(x["net_r"]<0 for x in rows),"worst":worst}

          configs={}
          all_symbols=set()
          for name,ts in o["trades"].items():
              all_symbols.update(x["symbol"] for x in ts)
              full=stats(ts)
              per={}
              for sym in sorted(set(x["symbol"] for x in ts)):
                  per[sym]=sum(float(x["r"]) for x in ts if x["symbol"]==sym)
              vals=sorted(per.items(),key=lambda z:z[1],reverse=True)
              total=full["net_r"]
              loso=[]
              for sym in sorted(all_symbols | set(per)):
                  q=stats([x for x in ts if x["symbol"]!=sym])
                  loso.append({"symbol":sym,**q,"removed_net_r":total-q["net_r"]})
              configs[name]={
                  "overrides":o["configs"][name],"full":full,
                  "early":slice_stats(ts,"2021-04-01","2023-10-01"),
                  "late":slice_stats(ts,"2023-10-01","2026-04-01"),
                  "recent_1y":slice_stats(ts,"2025-04-01","2026-04-01"),
                  "years":yearly(ts),
                  "rolling_6m":rolling(ts,6),"rolling_9m":rolling(ts,9),"rolling_12m":rolling(ts,12),
                  "symbol_concentration":{
                    "profitable_symbols":sum(v>0 for v in per.values()),
                    "losing_symbols":sum(v<0 for v in per.values()),
                    "trading_symbols":len(per),
                    "top1_share":vals[0][1]/total if vals and total else None,
                    "top3_share":sum(v for _,v in vals[:3])/total if total else None,
                    "top5_share":sum(v for _,v in vals[:5])/total if total else None,
                    "top5":vals[:5],"bottom5":vals[-5:]
                  },
                  "leave_one_symbol_out":{
                    "cases":len(loso),
                    "min_net_r":min(x["net_r"] for x in loso) if loso else None,
                    "min_pf":min(x["profit_factor"] for x in loso if x["profit_factor"] is not None) if loso else None,
                    "max_mdd_r":max(x["max_drawdown_r"] for x in loso) if loso else None,
                    "max_loss_streak":max(x["max_consecutive_losses"] for x in loso) if loso else None,
                    "largest_positive_dependency":max(loso,key=lambda x:x["removed_net_r"]) if loso else None
                  }
              }

          base=configs["baseline_exact"]["full"]
          parity={
             "expected_96_combo":expected,
             "actual_exact_baseline":base,
             "trades_diff":base["trades"]-expected["trades"],
             "net_r_diff":base["net_r"]-expected["net_r"],
             "pf_diff":(base["profit_factor"] or 0)-expected["profit_factor"],
             "mdd_diff":base["max_drawdown_r"]-expected["max_drawdown_r"]
          }
          out={"generated_at":datetime.now(UTC).isoformat(),"source":str(SRC),
               "fill_model":"15m exact touch: low <= entry <= high; trigger filter evaluated at actual first exact-touch 15m bar",
               "management":"10/30/60; TP1=>BE; TP2=>TP1; confirmed 4H pivot runner",
               "parity_vs_96_combo":parity,"candidates":configs}
          OUT.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({"parity":parity,"full":{k:v["full"] for k,v in configs.items()},
                            "recent_1y":{k:v["recent_1y"] for k,v in configs.items()},
                            "loso":{k:v["leave_one_symbol_out"] for k,v in configs.items()},
                            "rolling6":{k:v["rolling_6m"] for k,v in configs.items()}},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-track-b-exact-candidate-compare-v2
          path: |
            data/validation/stock_track_b_structural_exact_candidate_trades_v2.json
            data/validation/stock_track_b_structural_exact_candidate_compare_v2.json
          retention-days: 30
      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock_track_b_structural_exact_candidate_trades_v2.json data/validation/stock_track_b_structural_exact_candidate_compare_v2.json
          git commit -m "validation: compare exact-touch structural candidates v2 [skip ci]" || exit 0
          git pull --rebase origin main
          git push
