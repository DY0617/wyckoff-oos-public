name: Elliott Wave 3 v3 4H Fibonacci Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elliott-wave3-v3-4h-fib-diagnostic.yml"
      - "scripts/analyze_elliott_wave3_v3_4h_fib.py"

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/analyze_elliott_wave3_v3_4h_fib.py
      - name: Analyze Fibonacci buckets
        run: python scripts/analyze_elliott_wave3_v3_4h_fib.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-wave3-v3-4h-fib-diagnostic
          path: data/validation/elliott_wave3_v3_4h_fib_diagnostic.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/elliott_wave3_v3_4h_fib_diagnostic.json
          git commit -m "research: add Elliott Wave 3 v3 4H fib diagnostic [skip ci]" || exit 0
          git pull --rebase origin main
          git push
