name: Stacker v5 — independent retest, frozen research

on:
  push:
    branches: [research/stacker-v5-independent-retest]
    paths:
      - ".github/workflows/stacker-v5-independent-retest.yml"
      - "scripts/stacker_retest_v5_core.py"
      - "scripts/backtest_stacker_retest_v5.py"
      - "tests/test_stacker_retest_v5.py"
      - "strategy/stacker_v5_independent_retest_frozen.md"
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: stacker-v5-independent-retest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax
        run: python -m py_compile scripts/stacker_retest_v5_core.py scripts/backtest_stacker_retest_v5.py tests/test_stacker_retest_v5.py
      - name: Independent entry, stop, funding risk tests
        run: python -m unittest discover -s tests -p 'test_stacker_retest_v5.py' -v

  crypto:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Binance BTC/ETH original parent vs fresh retest variants, cost stress
        run: python scripts/backtest_stacker_retest_v5.py --market crypto --out data/validation/stacker_retest_v5_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-v5-independent-retest-crypto
          path: data/validation/stacker_retest_v5_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stock:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: US stock RTH original parent vs fresh retest variants, cost stress
        run: python scripts/backtest_stacker_retest_v5.py --market stock --out data/validation/stacker_retest_v5_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-v5-independent-retest-stock
          path: data/validation/stacker_retest_v5_stock.json
          retention-days: 30
          if-no-files-found: warn
