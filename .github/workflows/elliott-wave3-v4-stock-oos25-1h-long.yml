name: Elliott Wave 3 v4 Stock OOS25 1H LONG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elliott-wave3-v4-stock-oos25-1h-long.yml"
      - "scripts/extract_elliott_stock_oos25_recent5y_15m.py"
      - "scripts/backtest_elliott_wave3_v4_stock_oos25_1h_long.py"
      - "strategy/elliott_wave3_v4_stock_oos25_1h_long_frozen.md"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python -m py_compile scripts/extract_elliott_stock_oos25_recent5y_15m.py
      - run: python scripts/extract_elliott_stock_oos25_recent5y_15m.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-stock-oos25-cache
          path: |
            data/cache/elliott_stock_oos25_recent5y_15m.parquet
            data/cache/elliott_stock_oos25_recent5y_15m_meta.json
          retention-days: 7
          if-no-files-found: error

  backtest:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - uses: actions/download-artifact@v4
        with:
          name: elliott-stock-oos25-cache
          path: data/cache
      - name: Compile
        run: python -m py_compile scripts/backtest_elliott_wave3_v4_stock_oos25_1h_long.py
      - name: Run fresh Stock OOS25
        run: python scripts/backtest_elliott_wave3_v4_stock_oos25_1h_long.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-wave3-v4-stock-oos25-1h-long
          path: data/validation/elliott_wave3_v4_stock_oos25_1h_long.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/elliott_wave3_v4_stock_oos25_1h_long.json
          git commit -m "research: add Elliott Wave 3 v4 Stock OOS25 result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
