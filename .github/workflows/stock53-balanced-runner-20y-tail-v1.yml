name: Stock53 Balanced Runner 20Y Tail v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-balanced-runner-20y-tail-v1.yml"

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python -m py_compile scripts/backtest_stock53_track_b_balanced_runner_20y_shard_v1.py scripts/backtest_wyckoff_stock_filter_engine_exact_conservative_ratchet.py scripts/wyckoff_status.py
      - name: Run shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          DATA_END: "2026-04-01"
          OUT: "data/validation/stock53_balanced_runner_20y_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_stock53_track_b_balanced_runner_20y_shard_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock53-balanced-runner-tail-${{ matrix.id }}
          path: data/validation/stock53_balanced_runner_20y_shards/shard_${{ matrix.id }}.json
          retention-days: 7
          if-no-files-found: error
