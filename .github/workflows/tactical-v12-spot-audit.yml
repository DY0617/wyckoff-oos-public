name: Tactical v12 — real spot data / capital defense audit

on:
  push:
    branches: [research/tactical-v12-spot-audit]
    paths:
      - ".github/workflows/tactical-v12-spot-audit.yml"
      - "scripts/verified_spot_v12.py"
      - "scripts/tactical_allocation_v12_core.py"
      - "scripts/backtest_tactical_v12.py"
      - "tests/test_tactical_v12.py"
      - "strategy/tactical_v12_frozen.md"
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: tactical-v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax check
        run: python -m py_compile scripts/verified_spot_v12.py scripts/tactical_allocation_v12_core.py scripts/backtest_tactical_v12.py tests/test_tactical_v12.py
      - name: Verify spot candles, v11 parity, cash and causal defense
        run: python -m unittest discover -s tests -p 'test_tactical_v12.py' -v

  btc_eth_spot:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: True Binance Spot BTC/ETH past 5 years
        run: python scripts/backtest_tactical_v12.py --cohort btc_eth_spot --out data/validation/tactical_v12_btc_eth_spot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-v12-spot-btc-eth
          path: data/validation/tactical_v12_btc_eth_spot.json
          retention-days: 30
          if-no-files-found: warn

  five_crypto_spot:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: True Spot BTC ETH BNB SOL XRP
        run: python scripts/backtest_tactical_v12.py --cohort five_crypto_spot --out data/validation/tactical_v12_five_crypto_spot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-v12-spot-five-crypto
          path: data/validation/tactical_v12_five_crypto_spot.json
          retention-days: 30
          if-no-files-found: warn

  stocks:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install historical DuckDB source
        run: python -m pip install --disable-pip-version-check duckdb
      - name: US stock risk control comparison
        run: python scripts/backtest_tactical_v12.py --cohort stock --out data/validation/tactical_v12_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-v12-stock
          path: data/validation/tactical_v12_stock.json
          retention-days: 30
          if-no-files-found: warn
