name: Stock53 Track-B E Management Sweep 20Y

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-e-management-sweep-20y.yml"
      - "scripts/evaluate_stock53_e_management_shard.py"
      - "scripts/merge_stock53_e_management_sweep.py"
      - "strategy/stock_track_b_e_management_sweep_v1_frozen.md"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python -m py_compile scripts/evaluate_stock53_e_management_shard.py scripts/evaluate_stock53_filter_factorial_shard.py scripts/merge_stock53_e_management_sweep.py
      - name: Run shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          OUT: "data/validation/stock53_e_management_shards/shard_${{ matrix.id }}.json"
        run: python scripts/evaluate_stock53_e_management_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock53-e-management-${{ matrix.id }}
          path: data/validation/stock53_e_management_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stock53-e-management-*
          path: data/validation/stock53_e_management_shards
          merge-multiple: true
      - run: python scripts/merge_stock53_e_management_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock53-e-management-sweep-20y
          path: data/validation/stock53_e_management_sweep_20y.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock53_e_management_sweep_20y.json
          git commit -m "research: add stock Track-B E management sweep [skip ci]" || exit 0
          git pull --rebase origin main
          git push
