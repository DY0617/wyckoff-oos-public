name: US Dow2000 Track-B E 15-25-60 OOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-dow2000-track-b-e-15-25-60-oos.yml"
      - "scripts/extract_us_30x2_15m_hf.py"
      - "scripts/backtest_us_dow2000_track_b_e_15_25_60_oos_v1.py"
      - "scripts/backtest_us_30x2_track_b_25y.py"
      - "scripts/backtest_wyckoff_runner_sweep_engine.py"
      - "scripts/wyckoff_status.py"
      - "strategy/stock_track_b_e_15_25_60_dow2000_oos_v1_frozen.md"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {tag: "1999_2005", start: "1999-07", end: "2005-01"}
          - {tag: "2005_2010", start: "2005-01", end: "2010-01"}
          - {tag: "2010_2015", start: "2010-01", end: "2015-01"}
          - {tag: "2015_2020", start: "2015-01", end: "2020-01"}
          - {tag: "2020_2024", start: "2020-01", end: "2024-01"}
          - {tag: "2024_2026", start: "2024-01", end: "2026-01"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb pandas pyarrow
      - run: python scripts/extract_us_30x2_15m_hf.py --start "${{ matrix.start }}" --end "${{ matrix.end }}" --tag "${{ matrix.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dow2000-oos-${{ matrix.tag }}
          path: |
            data/chunks_us30x2/us30x2_15m_${{ matrix.tag }}.parquet
            data/chunks_us30x2/us30x2_15m_${{ matrix.tag }}.json
          retention-days: 2
          if-no-files-found: error

  backtest:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: dow2000-oos-*
          path: data/tmp_us30x2_25y
          merge-multiple: true
      - run: python -m py_compile scripts/backtest_us_dow2000_track_b_e_15_25_60_oos_v1.py scripts/backtest_us_30x2_track_b_25y.py scripts/backtest_wyckoff_runner_sweep_engine.py scripts/wyckoff_status.py
      - run: python scripts/backtest_us_dow2000_track_b_e_15_25_60_oos_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: dow2000-track-b-e-oos-result
          path: data/validation/us_dow2000_track_b_e_15_25_60_oos_v1.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/us_dow2000_track_b_e_15_25_60_oos_v1.json
          git commit -m "research: add Dow2000 Track-B E OOS result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
