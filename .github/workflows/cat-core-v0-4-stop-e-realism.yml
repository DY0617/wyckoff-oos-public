name: CAT-Core v0.4 Stop E Realism
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cat-core-v0-4-stop-e-realism.yml"
      - "scripts/analyze_cat_core_v0_4_stop_e_realism.py"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install duckdb
      - run: python -m py_compile scripts/analyze_cat_core_v0_4_stop_e_realism.py
      - run: python scripts/analyze_cat_core_v0_4_stop_e_realism.py
      - uses: actions/upload-artifact@v4
        with:
          name: cat-core-v0-4-stop-e-realism
          path: data/validation/cat_core_v0_4_stop_e_realism.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/cat_core_v0_4_stop_e_realism.json
          git commit -m "research: add CAT Stop E realism result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
