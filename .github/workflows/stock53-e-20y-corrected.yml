name: Stock53 E 20Y Corrected

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-e-20y-corrected.yml"
      - "scripts/backtest_stock53_track_b_e_hf_20y_shard_v3.py"
      - "scripts/merge_stock53_e_20y_corrected.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/backtest_stock53_track_b_e_hf_20y_shard_v3.py scripts/merge_stock53_e_20y_corrected.py
      - name: Run shard
        env:
          EVAL_START: "${{ matrix.start }}"
          EVAL_END: "${{ matrix.end }}"
          DATA_END: "2026-04-01"
          OUT: "data/validation/stock53_e_20y_corrected_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_stock53_track_b_e_hf_20y_shard_v3.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: stock53-e-20y-corrected-${{ matrix.id }}
          path: data/validation/stock53_e_20y_corrected_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: stock53-e-20y-corrected-*
          path: data/validation/stock53_e_20y_corrected_shards
          merge-multiple: true
      - name: Merge
        run: python scripts/merge_stock53_e_20y_corrected.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: stock53-e-20y-corrected
          path: data/validation/stock53_e_20y_corrected.json
          retention-days: 30
