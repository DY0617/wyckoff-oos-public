name: Build Stock50 Yahoo E Daily Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-stock50-yahoo-e-daily-cache.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/build_stock50_e_daily_yahoo_cache.py
      - run: python scripts/build_stock50_e_daily_yahoo_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock50-yahoo-e-daily-cache
          path: data/validation/stock50_e_daily_recent_cache.json
          retention-days: 30
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/stock50_e_daily_recent_cache.json
          git commit -m "research: refresh recent stock50 E daily cache from Yahoo [skip ci]" || exit 0
          git pull --rebase origin main
          git push
