name: Stock9 Spot vs Binance Same Window
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock9-spot-vs-binance-same-window.yml"
      - "scripts/backtest_stock9_spot_vs_binance_same_window.py"
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install duckdb
      - run: python scripts/backtest_stock9_spot_vs_binance_same_window.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock9-spot-vs-binance-same-window
          path: data/validation/stock9_spot_vs_binance_same_window.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/stock9_spot_vs_binance_same_window.json
          git commit -m "research: add stock9 spot-vs-Binance same-window result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
