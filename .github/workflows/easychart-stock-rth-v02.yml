name: EasyChart Stock RTH v0.2 OR-VWAP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_easychart_stock_rth_v02_or_vwap.py"
      - "scripts/extract_stock53_recent5y_15m_cache.py"
      - ".github/workflows/easychart-stock-rth-v02.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python scripts/extract_stock53_recent5y_15m_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: easychart-stock-rth-v02-cache
          path: |
            data/cache/stock53_recent5y_15m.parquet
            data/cache/stock53_recent5y_15m_meta.json
          retention-days: 7
          if-no-files-found: error

  backtest:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - uses: actions/download-artifact@v4
        with:
          name: easychart-stock-rth-v02-cache
          path: data/cache
      - run: python -m py_compile scripts/backtest_easychart_stock_rth_v02_or_vwap.py
      - name: Run stock RTH v0.2
        run: python scripts/backtest_easychart_stock_rth_v02_or_vwap.py
      - uses: actions/upload-artifact@v4
        with:
          name: easychart-stock-rth-v02
          path: data/validation/easychart_stock_rth_v02_or_vwap.json
          retention-days: 30
          if-no-files-found: error
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/easychart_stock_rth_v02_or_vwap.json
          git commit -m "research: add stock RTH v0.2 result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
