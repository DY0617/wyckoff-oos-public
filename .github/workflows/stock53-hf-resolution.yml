name: Stock53 HF 1M vs 15M Resolution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-hf-resolution.yml"
      - "scripts/backtest_wyckoff_exact_touch_resolution.py"
      - "scripts/backtest_stock53_hf_resolution_shard.py"
      - "scripts/merge_stock53_hf_resolution.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {id: "01", start: "2010-01-01", end: "2011-01-01"}
          - {id: "02", start: "2011-01-01", end: "2012-01-01"}
          - {id: "03", start: "2012-01-01", end: "2013-01-01"}
          - {id: "04", start: "2013-01-01", end: "2014-01-01"}
          - {id: "05", start: "2014-01-01", end: "2015-01-01"}
          - {id: "06", start: "2020-01-01", end: "2021-01-01"}
          - {id: "07", start: "2021-01-01", end: "2022-01-01"}
          - {id: "08", start: "2022-01-01", end: "2023-01-01"}
          - {id: "09", start: "2023-01-01", end: "2024-01-01"}
          - {id: "10", start: "2024-01-01", end: "2025-01-01"}
          - {id: "11", start: "2025-01-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/backtest_wyckoff_exact_touch_resolution.py scripts/backtest_stock53_hf_resolution_shard.py scripts/merge_stock53_hf_resolution.py
      - name: Run resolution shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          DATA_END: "2026-04-01"
          OUT: "data/validation/stock53_resolution_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_stock53_hf_resolution_shard.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: stock53-resolution-${{ matrix.id }}
          path: data/validation/stock53_resolution_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: stock53-resolution-*
          path: data/validation/stock53_resolution_shards
          merge-multiple: true
      - name: Merge
        run: python scripts/merge_stock53_hf_resolution.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: stock53-hf-1m-vs-15m-regime-comparison
          path: data/validation/stock53_hf_1m_vs_15m_regime_comparison.json
          retention-days: 30
      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock53_hf_1m_vs_15m_regime_comparison.json
          git commit -m "validation: add stock53 1m vs 15m regime comparison [skip ci]" || exit 0
          git pull --rebase origin main
          git push
