name: CAT-Core v0.4 Trail25 Funding Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cat-core-v0-4-trail25-funding.yml"
      - "scripts/analyze_cat_core_v0_4_trail25_funding.py"
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile scripts/analyze_cat_core_v0_4_trail25_funding.py
      - run: python scripts/analyze_cat_core_v0_4_trail25_funding.py
      - uses: actions/upload-artifact@v4
        with: {name: cat-core-v0-4-trail25-funding, path: data/validation/cat_core_v0_4_trail25_funding.json, retention-days: 30}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/cat_core_v0_4_trail25_funding.json
          git commit -m "research: add CAT trail25 funding result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
