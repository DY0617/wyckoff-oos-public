name: US Dow2000 Track-B E OOS Sharded

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/us-dow2000-track-b-e-oos-sharded.yml"
      - "scripts/backtest_us_dow2000_track_b_e_15_25_60_oos_v1.py"
      - "scripts/merge_us_dow2000_track_b_e_oos_shards.py"

permissions:
  contents: write
  actions: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {id: "01", syms: "MMM,AA,MO,AXP,BA"}
          - {id: "02", syms: "CAT,C,KO,DD,EK"}
          - {id: "03", syms: "XOM,GE,GM,HPQ,HD"}
          - {id: "04", syms: "HON,INTC,IBM,IP,JNJ"}
          - {id: "05", syms: "JPM,MCD,MRK,MSFT,PG"}
          - {id: "06", syms: "SBC,UTX,WMT,DIS,T"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: dow2000-oos-*
          path: data/tmp_us30x2_25y
          merge-multiple: true
          run-id: 36565492689
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m py_compile scripts/backtest_us_dow2000_track_b_e_15_25_60_oos_v1.py scripts/backtest_us_30x2_track_b_25y.py scripts/backtest_wyckoff_runner_sweep_engine.py scripts/wyckoff_status.py
      - name: Run shard
        env:
          TRADE_SYMS: "${{ matrix.syms }}"
          OUT: "data/validation/us_dow2000_track_b_e_oos_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_us_dow2000_track_b_e_15_25_60_oos_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: dow2000-e-oos-shard-${{ matrix.id }}
          path: data/validation/us_dow2000_track_b_e_oos_shards/shard_${{ matrix.id }}.json
          retention-days: 7
          if-no-files-found: error

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dow2000-e-oos-shard-*
          path: data/validation/us_dow2000_track_b_e_oos_shards
          merge-multiple: true
      - run: python scripts/merge_us_dow2000_track_b_e_oos_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: dow2000-e-oos-final
          path: data/validation/us_dow2000_track_b_e_15_25_60_oos_v1.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/us_dow2000_track_b_e_15_25_60_oos_v1.json
          git commit -m "research: add sharded Dow2000 Track-B E OOS result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
