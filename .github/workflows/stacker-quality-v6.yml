name: Stacker v6 — entry quality and risk regime study

on:
  push:
    branches: [research/stacker-v6-entry-quality]
    paths:
      - ".github/workflows/stacker-quality-v6.yml"
      - "scripts/stacker_quality_v6_core.py"
      - "scripts/backtest_stacker_quality_v6.py"
      - "tests/test_stacker_quality_v6.py"
      - "strategy/stacker_quality_v6_frozen.md"
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: stacker-quality-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Compile quality study
        run: python -m py_compile scripts/stacker_quality_v6_core.py scripts/backtest_stacker_quality_v6.py tests/test_stacker_quality_v6.py
      - name: Check causal and risk invariants
        run: python -m unittest discover -s tests -p 'test_stacker_quality_v6.py' -v

  crypto:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Historical BTC/ETH seven variant portfolio simulations
        run: python scripts/backtest_stacker_quality_v6.py --market crypto --out data/validation/stacker_quality_v6_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-quality-v6-crypto
          path: data/validation/stacker_quality_v6_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stock:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Historical US RTH seven variant portfolio simulations
        run: python scripts/backtest_stacker_quality_v6.py --market stock --out data/validation/stacker_quality_v6_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-quality-v6-stock
          path: data/validation/stacker_quality_v6_stock.json
          retention-days: 30
          if-no-files-found: warn
