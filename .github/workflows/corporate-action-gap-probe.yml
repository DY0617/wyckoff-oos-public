name: Corporate Action Gap Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/corporate-action-gap-probe.yml"
      - "scripts/probe_corporate_action_gaps.py"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - run: python scripts/probe_corporate_action_gaps.py
      - uses: actions/upload-artifact@v4
        with:
          name: corporate-action-gap-probe
          path: data/validation/corporate_action_gap_probe.json
          retention-days: 7
