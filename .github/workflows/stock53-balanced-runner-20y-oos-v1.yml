name: Stock53 Track-B Balanced Runner 20Y OOS v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock53-balanced-runner-20y-oos-v1.yml"
      - "scripts/backtest_stock53_track_b_balanced_runner_20y_shard_v1.py"
      - "scripts/merge_stock53_balanced_runner_20y_oos_v1.py"
      - "scripts/backtest_wyckoff_stock_filter_engine_exact_conservative_ratchet.py"
      - "scripts/wyckoff_status.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/backtest_stock53_track_b_balanced_runner_20y_shard_v1.py scripts/backtest_wyckoff_stock_filter_engine_exact_conservative_ratchet.py scripts/wyckoff_status.py
      - name: Run shard
        env:
          EVAL_START: ${{ matrix.start }}
          EVAL_END: ${{ matrix.end }}
          DATA_END: "2026-04-01"
          OUT: "data/validation/stock53_balanced_runner_20y_shards/shard_${{ matrix.id }}.json"
        run: python scripts/backtest_stock53_track_b_balanced_runner_20y_shard_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock53-balanced-runner-20y-${{ matrix.id }}
          path: data/validation/stock53_balanced_runner_20y_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stock53-balanced-runner-20y-*
          path: data/validation/stock53_balanced_runner_20y_shards
          merge-multiple: true
      - run: python scripts/merge_stock53_balanced_runner_20y_oos_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock53-balanced-runner-20y-oos-final-v1
          path: data/validation/stock53_balanced_runner_20y_oos_v1.json
          retention-days: 30
      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/stock53_balanced_runner_20y_oos_v1.json
          git commit -m "validation: add balanced runner 20y OOS v1 [skip ci]" || exit 0
          git pull --rebase origin main
          git push
