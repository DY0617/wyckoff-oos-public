name: M1 Risk Controls 20Y V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m1-risk-controls-20y-v2.yml"
      - "scripts/enrich_m1_breadth_20y_shard.py"
      - "scripts/merge_m1_risk_controls_20y_v2.py"

permissions:
  contents: write

jobs:
  shard:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {id: "01", start: "2006-04-01", end: "2010-04-01"}
          - {id: "02", start: "2010-04-01", end: "2014-04-01"}
          - {id: "03", start: "2014-04-01", end: "2018-04-01"}
          - {id: "04", start: "2018-04-01", end: "2022-04-01"}
          - {id: "05", start: "2022-04-01", end: "2026-04-01"}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Syntax check
        run: python -m py_compile scripts/enrich_m1_breadth_20y_shard.py scripts/merge_m1_risk_controls_20y_v2.py
      - name: Run shard
        env:
          EVAL_START: "${{ matrix.start }}"
          EVAL_END: "${{ matrix.end }}"
          OUT: "data/validation/m1_risk_control_shards/shard_${{ matrix.id }}.json"
        run: python scripts/enrich_m1_breadth_20y_shard.py
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: m1-risk-control-v2-${{ matrix.id }}
          path: data/validation/m1_risk_control_shards/shard_${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: m1-risk-control-v2-*
          path: data/validation/m1_risk_control_shards
          merge-multiple: true
      - name: Merge
        run: python scripts/merge_m1_risk_controls_20y_v2.py
      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: m1-risk-controls-20y-v2
          path: data/validation/m1_risk_controls_20y_v2.json
          retention-days: 30
