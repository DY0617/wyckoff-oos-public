name: LDFR v2 Trend RS Crypto8 5Y

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ldfr-v2-trend-rs-crypto8-5y.yml"
      - "scripts/backtest_ldfr_v2_trend_rs_crypto8_5y.py"
      - "strategy/ldfr_v2_trend_rs_frozen.md"

permissions:
  contents: write

concurrency:
  group: ldfr-v2-trend-rs-crypto8-5y
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/backtest_ldfr_v2_trend_rs_crypto8_5y.py
      - name: Run frozen v2 discovery
        env:
          OUT: data/validation/ldfr_v2_trend_rs_crypto8_5y.json
        run: python scripts/backtest_ldfr_v2_trend_rs_crypto8_5y.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ldfr-v2-trend-rs-crypto8-5y
          path: data/validation/ldfr_v2_trend_rs_crypto8_5y.json
          retention-days: 30
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/ldfr_v2_trend_rs_crypto8_5y.json
          git commit -m "research: add LDFR v2 trend RS result [skip ci]" || exit 0
          git pull --rebase origin main
          git push
