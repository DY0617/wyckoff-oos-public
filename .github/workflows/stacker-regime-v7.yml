name: Stacker v7 — market regimes and unseen instrument holdout

on:
  push:
    branches: [research/stacker-v7-regime-holdout]
    paths:
      - ".github/workflows/stacker-regime-v7.yml"
      - "scripts/stacker_regime_v7_core.py"
      - "scripts/backtest_stacker_regime_v7.py"
      - "tests/test_stacker_regime_v7.py"
      - "strategy/stacker_v7_regime_holdout_frozen.md"
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: stacker-regime-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax
        run: python -m py_compile scripts/stacker_regime_v7_core.py scripts/backtest_stacker_regime_v7.py tests/test_stacker_regime_v7.py
      - name: Causal risk gate and holdout invariants
        run: python -m unittest discover -s tests -p 'test_stacker_regime_v7.py' -v

  crypto_known:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Eight frozen regime variants on BTC and ETH
        run: python scripts/backtest_stacker_regime_v7.py --cohort known_crypto --out data/validation/stacker_regime_v7_known_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-regime-v7-known-crypto
          path: data/validation/stacker_regime_v7_known_crypto.json
          retention-days: 30
          if-no-files-found: warn

  crypto_holdout:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Previously untested BNB SOL XRP futures, BTC reference
        run: python scripts/backtest_stacker_regime_v7.py --cohort heldout_crypto --out data/validation/stacker_regime_v7_heldout_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-regime-v7-new-symbol-holdout
          path: data/validation/stacker_regime_v7_heldout_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stocks:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: DuckDB for remote parquet RTH candles
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Eight frozen variants on US stock universe
        run: python scripts/backtest_stacker_regime_v7.py --cohort stock --out data/validation/stacker_regime_v7_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-regime-v7-stocks
          path: data/validation/stacker_regime_v7_stock.json
          retention-days: 30
          if-no-files-found: warn
