name: Tactical v14 — adaptive trend budget + annual and cost stress

on:
  push:
    branches: [research/tactical-v14-risk-on-budget]
    paths:
      - ".github/workflows/tactical-v14-risk-budget.yml"
      - "scripts/tactical_v14_core.py"
      - "scripts/backtest_tactical_v14.py"
      - "tests/test_tactical_v14.py"
      - "strategy/tactical_v14_frozen.md"
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: tactical-v14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax checks
        run: python -m py_compile scripts/tactical_v14_core.py scripts/backtest_tactical_v14.py tests/test_tactical_v14.py
      - name: Ensure old strategy parity and causally capped new budgets
        run: python -m unittest discover -s tests -p 'test_tactical_v14.py' -v

  btc_eth_spot:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: BTC ETH actual spot versus six controls and all v14 policies
        run: python scripts/backtest_tactical_v14.py --cohort btc_eth_spot --out data/validation/tactical_v14_btc_eth.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-v14-btc-eth
          path: data/validation/tactical_v14_btc_eth.json
          retention-days: 30
          if-no-files-found: warn

  five_crypto_spot:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Five coin actual spot budget/adaptive breadth tests
        run: python scripts/backtest_tactical_v14.py --cohort five_crypto_spot --out data/validation/tactical_v14_five_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-v14-five-crypto
          path: data/validation/tactical_v14_five_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stocks:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Selected US stock regimes and SPY benchmark
        run: python scripts/backtest_tactical_v14.py --cohort stock --out data/validation/tactical_v14_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactical-v14-stocks
          path: data/validation/tactical_v14_stock.json
          retention-days: 30
          if-no-files-found: warn
