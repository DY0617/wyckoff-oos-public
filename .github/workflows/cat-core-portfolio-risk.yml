name: CAT-Core Portfolio Risk Compare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_cat_core_portfolio_risk.py"
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/analyze_cat_core_portfolio_risk.py
      - uses: actions/upload-artifact@v4
        with:
          name: cat-core-portfolio-risk
          path: data/validation/cat_core_portfolio_risk_compare.json
          retention-days: 30
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DY0617@users.noreply.github.com"
          git add data/validation/cat_core_portfolio_risk_compare.json
          git commit -m "research: add CAT-Core portfolio risk comparison [skip ci]" || exit 0
          git pull --rebase origin main
          git push
