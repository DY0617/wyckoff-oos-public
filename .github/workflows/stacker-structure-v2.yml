name: Stacker v2 — S/R EMA structural exits

on:
  push:
    branches: [research/stacker-structure-v2]
    paths:
      - ".github/workflows/stacker-structure-v2.yml"
      - "scripts/stacker_structure_v2_core.py"
      - "scripts/backtest_stacker_structure_v2.py"
      - "tests/test_stacker_structure_v2.py"
      - "strategy/stacker_structure_v2_frozen.md"
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: stacker-structure-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Syntax
        run: python -m py_compile scripts/stacker_structure_v2_core.py scripts/backtest_stacker_structure_v2.py tests/test_stacker_structure_v2.py
      - name: Test causal pivots and frozen structural exits
        run: python -m unittest discover -s tests -p 'test_stacker_structure_v2.py' -v

  crypto:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Binance BTC/ETH 5y four exit modes and 4bp stress
        run: python scripts/backtest_stacker_structure_v2.py --market crypto --out data/validation/stacker_structure_v2_crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-structure-v2-crypto
          path: data/validation/stacker_structure_v2_crypto.json
          retention-days: 30
          if-no-files-found: warn

  stocks:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb
      - name: US stock RTH 4.5y four exit modes and 4bp stress
        run: python scripts/backtest_stacker_structure_v2.py --market stock --out data/validation/stacker_structure_v2_stock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stacker-structure-v2-stock
          path: data/validation/stacker_structure_v2_stock.json
          retention-days: 30
          if-no-files-found: warn
