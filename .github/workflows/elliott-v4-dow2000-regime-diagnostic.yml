name: Elliott v4 DJIA2000 Regime Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/elliott-v4-dow2000-regime-diagnostic.yml"
      - "scripts/analyze_elliott_v4_dow2000_regimes.py"

permissions:
  actions: read
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Reuse DJIA2000 extraction artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: elliott-dow2000-*
          path: data/tmp_us30x2_25y
          merge-multiple: true
          repository: DY0617/wyckoff-oos-public
          run-id: 37103825559
          github-token: ${{ github.token }}
      - run: python scripts/analyze_elliott_v4_dow2000_regimes.py
      - uses: actions/upload-artifact@v4
        with:
          name: elliott-v4-dow2000-regime-diagnostic
          path: data/validation/elliott_wave3_v4_dow2000_regime_diagnostic.json
          retention-days: 30
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/elliott_wave3_v4_dow2000_regime_diagnostic.json
          git commit -m "research: add Elliott v4 DJIA2000 regime diagnostic [skip ci]" || exit 0
          git pull --rebase origin main
          git push
