name: US 30x2 Track B Long-Horizon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/extract_us_30x2_15m_hf.py"
      - "scripts/backtest_us_30x2_track_b_25y.py"
      - "scripts/backtest_wyckoff_5y.py"
      - "scripts/wyckoff_status.py"
      - ".github/workflows/us-30x2-track-b-25y.yml"

permissions:
  contents: write

jobs:
  extract:
    name: extract-${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "1999_2005"
            start: "1999-07"
            end: "2005-01"
          - tag: "2005_2010"
            start: "2005-01"
            end: "2010-01"
          - tag: "2010_2015"
            start: "2010-01"
            end: "2015-01"
          - tag: "2015_2020"
            start: "2015-01"
            end: "2020-01"
          - tag: "2020_2024"
            start: "2020-01"
            end: "2024-01"
          - tag: "2024_2026"
            start: "2024-01"
            end: "2026-01"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check duckdb pandas pyarrow

      - name: Extract both US universes to 15m
        run: |
          python scripts/extract_us_30x2_15m_hf.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --tag "${{ matrix.tag }}"

      - name: Upload compressed chunk
        uses: actions/upload-artifact@v4
        with:
          name: us30x2-${{ matrix.tag }}
          path: |
            data/chunks_us30x2/us30x2_15m_${{ matrix.tag }}.parquet
            data/chunks_us30x2/us30x2_15m_${{ matrix.tag }}.json
          retention-days: 1
          if-no-files-found: error

  backtest:
    name: backtest-${{ matrix.universe }}
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        universe: ["current30","dow2000"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backtest dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          pattern: us30x2-*
          path: data/tmp_us30x2_25y
          merge-multiple: true

      - name: Verify chunks
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find data/tmp_us30x2_25y -name 'us30x2_15m_*.parquet' | wc -l)"
          echo "chunk_count=$COUNT"
          test "$COUNT" -eq 6

      - name: Run frozen Track B
        run: python scripts/backtest_us_30x2_track_b_25y.py --universe "${{ matrix.universe }}"

      - name: Show summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          u=os.environ["UNIVERSE"]
          p=json.load(open(f"data/validation/us_{u}_track_b_25y.json"))
          print(json.dumps({
            "universe":p.get("universe"),
            "totals_raw_aggregate":p.get("totals_raw_aggregate"),
            "conservative_5r_cap":p.get("conservative_5r_cap"),
            "breadth":p.get("breadth"),
            "errors":p.get("errors")
          },ensure_ascii=False,indent=2))
          PY
        env:
          UNIVERSE: ${{ matrix.universe }}

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.universe }}
          path: data/validation/us_${{ matrix.universe }}_track_b_25y.json
          retention-days: 7
          if-no-files-found: error

  commit:
    name: commit-results
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download result files
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: data/validation
          merge-multiple: true

      - name: Commit validation results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/us_current30_track_b_25y.json data/validation/us_dow2000_track_b_25y.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "validation: add US current30 and Dow2000 long-horizon results [skip ci]"
            git push
          fi
